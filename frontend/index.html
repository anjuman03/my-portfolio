    <script>
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      // Dark unless the visitor has chosen light before
      if (saved !== "light") {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {
      document.documentElement.classList.add("dark");
    }
  })();
</script>

    <div id="root"></div>

  </body>
